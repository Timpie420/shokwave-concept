<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090c" />
  <title>Shockwave</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root { color-scheme: dark; --bg:#07090c; --card:#12161c; --line:#26303a; --txt:#e8edf2; --mut:#8b97a3; --acc:#6ee7ff; --hit:#ff5a6a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--txt); min-height:100dvh; }
    header { padding:1rem 1rem .35rem; }
    header h1 { margin:0; font-size:1.35rem; letter-spacing:.08em; text-transform:uppercase; }
    header p { margin:.3rem 0 0; color:var(--mut); font-size:.88rem; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; padding:1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:.9rem; }
    .wide { grid-column:1/-1; }
    .k { color:var(--mut); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; }
    .v { font-variant-numeric:tabular-nums; font-size:1.3rem; margin-top:.2rem; }
    .bar { height:8px; background:#1b222a; border-radius:99px; overflow:hidden; margin-top:.55rem; }
    .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--acc),var(--hit)); }
    .row { display:flex; gap:.55rem; flex-wrap:wrap; }
    button, input { appearance:none; border:1px solid var(--line); background:#1a2129; color:var(--txt); border-radius:12px; padding:.7rem .9rem; font-weight:600; }
    button.pri { background:var(--acc); color:#061016; border-color:transparent; }
    button.danger { background:#3a1518; border-color:#5a2228; color:#ffc4ca; }
    button:disabled { opacity:.45; }
    input { flex:1; min-width:10rem; font-weight:500; }
    #status { font-size:.82rem; color:var(--mut); padding:0 1rem; }
    ul { list-style:none; margin:.4rem 0 0; padding:0; max-height:36vh; overflow:auto; }
    li { border-top:1px solid var(--line); padding:.5rem 0; display:flex; justify-content:space-between; font-size:.86rem; }
    .hit { color:var(--hit); } .ok { color:var(--acc); }
    .dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; background:#445; margin-right:.35rem; }
    .dot.on { background:#3ddc84; }
  </style>
</head>
<body>
  <header>
    <h1>Shockwave</h1>
    <p>Telefoon = scherm. Sensoren zitten op de Arduino-module op het board.</p>
  </header>
  <div id="status"><span class="dot"></span>Module niet verbonden.</div>
  <section class="grid">
    <div class="card"><div class="k">G-kracht module</div><div class="v" id="g">0.00</div><div class="bar"><i id="gbar"></i></div></div>
    <div class="card"><div class="k">Piek</div><div class="v" id="peak">0.00</div></div>
    <div class="card"><div class="k">Hits</div><div class="v" id="hits">0</div></div>
    <div class="card"><div class="k">Laatste lijn</div><div class="v" id="raw" style="font-size:.78rem">-</div></div>
    <div class="card wide">
      <div class="row">
        <button class="pri" id="ble">BLE module</button>
        <button id="ws">WiFi / WebSocket</button>
        <button id="stop" disabled>Verbreek</button>
        <button class="danger" id="clear">Wis log</button>
      </div>
      <div class="row" style="margin-top:.55rem"><input id="wsurl" value="ws://192.168.4.1/ws" /></div>
    </div>
    <div class="card wide"><div class="k">Log</div><ul id="log"></ul></div>
  </section>
  <script>
    const $=id=>document.getElementById(id);
    const KEY="shockwave-mod-v1";
    const UART="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
    let peak=0,hits=0,lastHit=0,sock=null,device=null,buf="";
    let log=JSON.parse(localStorage.getItem(KEY)||"[]");
    function setStatus(t,on){$("status").innerHTML='<span class="dot '+(on?"on":"")+'"></span>'+t;$("stop").disabled=!on;}
    function save(){localStorage.setItem(KEY,JSON.stringify(log.slice(0,400)));}
    function render(){$("log").innerHTML=log.slice(0,80).map(e=>'<li><span class="'+(e.g>=3?"hit":"ok")+'">'+e.t+' \u00b7 '+e.g.toFixed(2)+' g</span><span>'+e.src+'</span></li>').join("")||"<li>Nog geen slagen van de module.</li>";$("hits").textContent=hits;$("peak").textContent=peak.toFixed(2);}
    function ingest(g,src){$("g").textContent=g.toFixed(2);$("gbar").style.width=Math.min(100,g/8*100)+"%";if(g>peak)peak=g;$("peak").textContent=peak.toFixed(2);const now=Date.now();if(g>=2.4&&now-lastHit>500){lastHit=now;hits++;log.unshift({t:new Date().toLocaleTimeString("nl-BE"),g,src});save();render();}}
    function parseLine(line,src){line=line.trim();if(!line)return;$("raw").textContent=line.slice(0,80);let g=null;try{const j=JSON.parse(line);if(typeof j.g==="number")g=j.g;else if(typeof j.ax==="number"){const ax=j.ax,ay=j.ay||0,az=j.az||0;g=Math.sqrt(ax*ax+ay*ay+az*az)/((j.unit==="g")?1:9.81);}}catch(_){const m=line.match(/g[=:]?\s*([0-9.]+)/i)||line.match(/^([0-9.]+)/);if(m)g=parseFloat(m[1]);}if(g!=null&&isFinite(g))ingest(g,src);}
    function feed(chunk,src){buf+=chunk;const parts=buf.split(/\r?\n/);buf=parts.pop()||"";parts.forEach(p=>parseLine(p,src));}
    async function connectBLE(){try{device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[UART,"battery_service"]});const server=await device.gatt.connect();const service=await server.getPrimaryService(UART);const rx=await service.getCharacteristic(RX);await rx.startNotifications();rx.addEventListener("characteristicvaluechanged",ev=>feed(new TextDecoder().decode(ev.target.value),"ble"));device.addEventListener("gattserverdisconnected",()=>setStatus("BLE weg.",false));setStatus("BLE module verbonden. Telefoon mag blijven waar die is.",true);}catch(e){setStatus("BLE mislukt: "+e.message+" — probeer WiFi.",false);}}
    function connectWS(){try{sock=new WebSocket($("wsurl").value.trim());sock.onopen=()=>setStatus("WiFi-module verbonden.",true);sock.onclose=()=>setStatus("WiFi weg.",false);sock.onerror=()=>setStatus("WiFi fout. Check AP / IP.",false);sock.onmessage=ev=>feed(String(ev.data),"wifi");}catch(e){setStatus("WebSocket: "+e.message,false);}}
    function disconnect(){try{sock&&sock.close();}catch(_){}
      try{device&&device.gatt.disconnect();}catch(_){}
      sock=null;device=null;setStatus("Verbroken.",false);}
    $("ble").onclick=connectBLE;$("ws").onclick=connectWS;$("stop").onclick=disconnect;
    $("clear").onclick=()=>{log=[];hits=0;peak=0;save();render();};
    hits=log.length;peak=log.reduce((m,e)=>Math.max(m,e.g),0);render();
  </script>
</body>
</html>
